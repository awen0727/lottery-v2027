<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OBS 透明抽獎疊圖｜V2027</title>
  <style>
    :root{font-family:"Noto Serif TC","Songti TC","Microsoft JhengHei",serif;color:#fff1be;background:transparent;color-scheme:dark}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent!important}body{opacity:0;transition:opacity .25s ease}body.visible{opacity:1}
    main{position:relative;width:100vw;height:100vh;display:grid;place-items:center;padding:7vh 6vw;pointer-events:none}
    .glow{position:absolute;inset:0;background:radial-gradient(ellipse at center,#efb95630 0,transparent 43%);opacity:.7}
    .spark{position:absolute;width:5px;height:5px;border-radius:50%;background:#ffe59b;box-shadow:0 0 14px 4px #e7a846;animation:float 3.4s ease-in-out infinite;opacity:.75}.spark:nth-child(2){left:12%;top:23%;animation-delay:-1.1s}.spark:nth-child(3){right:13%;top:30%;animation-delay:-2.2s}.spark:nth-child(4){left:20%;bottom:20%;animation-delay:-.5s}.spark:nth-child(5){right:21%;bottom:17%;animation-delay:-2.8s}
    .panel{position:relative;width:min(1450px,91vw);min-height:42vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:clamp(28px,5vh,70px) clamp(26px,5vw,90px);border:2px solid #e6b95e;border-radius:clamp(18px,2vw,38px);background:linear-gradient(145deg,#100805e8,#29170bdd 48%,#090402e8);box-shadow:0 0 0 6px #130a06cc,0 0 0 8px #8e642d99,0 22px 70px #000c,inset 0 0 50px #f7c86b12;clip-path:polygon(4% 0,96% 0,100% 13%,100% 87%,96% 100%,4% 100%,0 87%,0 13%)}
    .panel:before,.panel:after{content:"";position:absolute;left:9%;right:9%;height:2px;background:linear-gradient(90deg,transparent,#fbe6a4,#d18f31,#fbe6a4,transparent);box-shadow:0 0 16px #e5a844}.panel:before{top:8%}.panel:after{bottom:8%}
    .eyebrow{margin:0 0 1.1vh;color:#e4c176;font:700 clamp(13px,1.3vw,24px)/1.2 system-ui,sans-serif;letter-spacing:.28em;text-transform:uppercase}.prize{max-width:20ch;margin:0 0 clamp(18px,3vh,40px);padding:.34em 1.8em;color:#650b17;background:linear-gradient(90deg,transparent,#e8b654 15%,#fff0ae 50%,#d99b39 85%,transparent);font-weight:900;font-size:clamp(30px,4.2vw,76px);line-height:1.15;text-shadow:0 1px #fff7c0}
    .notice{margin:0;max-width:18ch;white-space:pre-line;color:#ffe8a2;font-weight:900;font-size:clamp(44px,6.5vw,118px);line-height:1.12;text-shadow:0 3px #6e390e,0 0 24px #e5a33a88}.notice.rolling{animation:pulse .7s ease-in-out infinite alternate}.notice.rolling:after{content:"";display:block;width:min(600px,55vw);height:4px;margin:.35em auto 0;background:linear-gradient(90deg,transparent,#fff0aa,#c87a1a,#fff0aa,transparent);animation:sweep 1.1s linear infinite}
    .numbers{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:clamp(12px,1.5vw,28px);list-style:none;margin:0;padding:0}.numbers li{min-width:4.8em;padding:.16em .35em;border:1px solid #f2c768cc;border-radius:.18em;background:linear-gradient(180deg,#fff5bd 0,#e2a63d 45%,#8f4c10 100%);box-shadow:0 8px 0 #3b1c08,0 14px 30px #000a,0 0 20px #f1bb5c55;color:#160b03;font:900 clamp(42px,7vw,122px)/1.08 Georgia,"Times New Roman",serif;letter-spacing:.04em;text-shadow:0 1px #fff7ca;animation:ticketIn .55s cubic-bezier(.16,.8,.25,1.15) both}.numbers.many li{font-size:clamp(26px,4vw,66px);min-width:4.4em}
    #connection{position:absolute;right:2vw;bottom:1.5vh;margin:0;color:#ffe4a8;font:600 clamp(10px,.9vw,16px)/1.3 system-ui,sans-serif;text-shadow:0 2px 5px #000}
    [hidden]{display:none!important}@keyframes ticketIn{from{opacity:0;transform:translateY(50px) scale(.7) rotateX(60deg)}to{opacity:1;transform:none}}@keyframes pulse{to{opacity:.58;transform:scale(.98)}}@keyframes sweep{from{transform:translateX(-15%)}to{transform:translateX(15%)}}@keyframes float{50%{transform:translateY(-18px) scale(1.5);opacity:.35}}
    @media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
  </style>
</head>
<body><main aria-live="polite">
  <div class="glow"></div><i class="spark"></i><i class="spark"></i><i class="spark"></i><i class="spark"></i>
  <section id="panel" class="panel" hidden>
    <p class="eyebrow">2026–2027 EVENT LOTTERY</p>
    <h1 id="prizeName" class="prize"></h1>
    <p id="notice" class="notice"></p>
    <ul id="numbers" class="numbers" hidden></ul>
  </section>
  <p id="connection" role="status"></p>
</main><script src="config.js"></script><script src="overlay.js?v=20261112-2"></script></body>
</html>
